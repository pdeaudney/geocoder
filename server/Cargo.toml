[package]
name = "query-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted geocoder: reverse, forward, autocomplete, validate, IP geocode over REST + gRPC"
license = "Apache-2.0"
readme = "../README.md"

[dependencies]
# mimalloc replaces the system allocator across every binary in this
# crate. Microsoft's allocator outperforms glibc malloc / macOS
# libsystem_malloc on the alloc-heavy paths (tantivy postings, FST
# builds, hashmap rehashes, string interning). 5–15 % across the
# board on the build pipeline; smaller but non-zero impact on the
# query server.
mimalloc = { version = "0.1", default-features = false }
# rayon used by builders to parallelise per-country / per-state ingestion
# (build-openaddresses-index, build-gnaf-index). The query-server itself
# doesn't use rayon — but the dep is shared because the build binaries
# live in the same crate.
rayon = "1.10"
csv = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
s2 = "0.0.13"
rustls-acme = { version = "0.14", features = ["axum"] }
axum-server = "0.7"
arc-swap = "1.7"
tantivy = { version = "0.22", optional = true }
maxminddb = "0.24"
fst = "0.4"
# H3 hexagonal spatial index — pure-Rust, from-scratch implementation
# of the H3 spec, not a binding to the C reference impl. Active
# upstream (HydroniumLabs/h3o), zero open issues, tracks the official
# H3 issue tracker for spec parity. Used at query time to stamp an
# H3 cell on response coords; no on-disk footprint.
h3o = "0.9"
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
# Structured logging + tracing. tracing-subscriber emits JSON to stdout in
# production; tracing-opentelemetry forwards spans to an OTLP collector
# when OTEL_EXPORTER_OTLP_ENDPOINT is set. Pick a single major-version
# pin across opentelemetry, opentelemetry_sdk, opentelemetry-otlp,
# opentelemetry-semantic-conventions and tracing-opentelemetry — they
# evolve in lockstep and a mismatched pair won't link.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-opentelemetry = { version = "0.32", default-features = false, features = ["tracing-log"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics", "rt-tokio", "internal-logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "reqwest-client", "internal-logs"] }
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"] }
# Per-request HTTP/gRPC server spans. The TraceLayer wraps the axum
# router and the tonic service so every inbound call gets a parent
# span with semconv-named attributes.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
# Direct reqwest dep for the shadow-validation worker (server/src/shadow.rs).
# Already transitive via opentelemetry-otlp's reqwest-client feature; pinning
# it here unifies the version and lets us pick rustls-tls explicitly.
# default-features=false to avoid pulling native-tls (and thus OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }
# rand for the shadow sampler's per-request probability gate. Already
# transitive via opentelemetry_sdk's `trace` feature; promoting it to
# direct gets us a stable import path without a version bump.
rand = "0.8"
# UTC-midnight clock for the shadow daily-cap reset task. Already
# transitive via OTel's tracing-opentelemetry and tantivy; explicit
# import for the chrono::Utc::now() / next_midnight calc.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Prometheus exporter — exposes /metrics in the canonical text format
# and provides counter/histogram/gauge primitives. tikv/rust-prometheus
# (0.13) is mature, used by Linkerd / TiKV / others; preferred here
# over the newer prometheus-client crate because the simpler register-
# once-and-write API matches our handler shape and we don't need
# encoder pluggability.
prometheus = { version = "0.13", default-features = false }
# Data fetcher (`fetch-data` binary) deps. CLI parsing, content
# integrity, MaxMind tarball extract, AWS S3 (OpenAddresses
# Requester-Pays), HTTP date formatting, terminal progress.
clap = { version = "4.6", features = ["derive", "env"] }
md-5 = "0.10"
httpdate = "1.0"
indicatif = "0.18"
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
futures = "0.3"
# AWS deps for OpenAddresses (Requester-Pays S3 bucket). Feature
# selection mirrors the auth surface the deleted bash version had
# via the `aws` CLI:
#
#   - `rustls`           transitively pulls in `client-hyper` +
#                        `default-https-client`, which gives us the
#                        HTTPS client used by IMDS, STS, etc.
#   - `rt-tokio`         tokio runtime for credential refresh.
#   - `sso`              AWS SSO (`aws sso login`) — common in
#                        enterprise / Identity Center deployments;
#                        the default-features chain enables it and
#                        we'd silently break those operators without it.
#   - `credentials-process` honours the `credential_process` directive
#                           in ~/.aws/config (used by Granted, aws-vault,
#                           leapp, and similar credential-helper tools).
#   - `behavior-version-latest` opts into the newest SDK behaviours.
#
# We keep `default-features = false` to avoid pulling in the
# native-tls + openssl stack that the SDK would otherwise enable.
aws-config = { version = "1.5", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest", "sso", "credentials-process"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-credential-types = "1.2"
url = "2"
# Lookup external commands on PATH (currently the lbzip2/pbzip2/bzip2
# decoder priority chain in the WoF fetch path). 1.5 KB lib, well
# tested across platforms; cheaper than reimplementing PATH split.
which = "7"
# ICU CLDR transliteration via system libicu (FFI). Used by the
# build pipeline ONLY — `build-forward-index` and
# `build-autocomplete-fst` emit Latin transliterations of every
# non-Latin name (Cyrillic, Greek, Han, Kana, Arabic, Hebrew, Thai,
# Devanagari, Persian, …) into the index files. The runtime
# query-server does not link libicu — the transliterated forms are
# baked into the on-disk index and read back as plain UTF-8.
#
# Why not ICU4X (`icu_experimental`): ICU4X 0.5 ships baked CLDR
# data for only Han/Kana/Ethiopic plus a handful of per-language
# Cyrillic BGN scripts. Russian/Greek/Arabic/Thai/Devanagari Latin
# transliterators are not bundled — the very scripts our
# multilingual users need. ICU4X requires `datagen` to compile
# additional rules, which adds significant build complexity for
# parity with libicu.
#
# Build-host install: `apt install libicu-dev` (Debian/Ubuntu),
# `brew install icu4c` (macOS — set PKG_CONFIG_PATH to the formula
# pkgconfig dir). See README "Build from source" for details.
rust_icu_utrans = { version = "5", optional = true }
rust_icu_ustring = { version = "5", optional = true }
rust_icu_common = { version = "5", optional = true }
rust_icu_sys = { version = "5", optional = true }

[features]
default = ["forward", "grpc", "translit"]
# `forward` wires in tantivy for the /search endpoint. Drop it for a lean
# reverse-only build.
forward = ["dep:tantivy"]
# `grpc` starts a gRPC server alongside the REST API on a separate port.
# Messages mirror the REST JSON shape; see server/proto/geocoder.proto.
grpc = ["dep:tonic", "dep:prost"]
# `translit` enables ICU-based transliteration in the build
# pipeline (build-forward-index, build-autocomplete-fst). Default-on
# so the index picks up Cyrillic / CJK / Arabic / Greek / Hebrew /
# Thai / Devanagari Latin transliterations. Operators serving an
# exclusively-Latin corpus can build the runtime query-server
# without this feature; the build binaries gate it via
# required-features.
translit = ["dep:rust_icu_utrans", "dep:rust_icu_ustring", "dep:rust_icu_common", "dep:rust_icu_sys"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# getrusage() for max-RSS measurements in operational-resilience tests.
# libc is already a transitive dep of tokio/hyper; pulling it in here just
# adds a direct import path.
libc = "0.2"
tempfile = "3"
# parking_lot's Mutex returns the guard directly (no Result), keeping
# the integration tests readable. Already a transitive dep via several
# of our crates.
parking_lot = "0.12"

[[bench]]
name = "reverse_geocode"
harness = false

[[bench]]
name = "autocomplete"
harness = false

[[bin]]
name = "query-server"
path = "src/main.rs"

[[bin]]
name = "build-forward-index"
path = "src/bin/build_forward_index.rs"
required-features = ["forward", "translit"]

[[bin]]
name = "build-postcode-lookup"
path = "src/bin/build_postcode_lookup.rs"

[[bin]]
name = "build-gnaf-index"
path = "src/bin/build_gnaf_index.rs"

[[bin]]
name = "build-openaddresses-index"
path = "src/bin/build_openaddresses_index.rs"

[[bin]]
name = "build-autocomplete-fst"
path = "src/bin/build_autocomplete_fst.rs"
required-features = ["translit"]

[[bin]]
name = "fetch-data"
path = "src/bin/fetch_data.rs"

# NOTE: build profiles live at the workspace root (`/Cargo.toml`)
# rather than here. Member-level profile sections are silently
# ignored by Cargo when there's a workspace, and the resulting
# missing-LTO had been a no-op in production for the duration of
# this crate's history. The Dockerfile builds `server/` standalone
# (no workspace Cargo.toml in /src), so for that one context we
# wouldn't get the workspace profile applied — `Dockerfile` adds
# `--config 'profile.release.lto=true'` on the cargo invocation
# to keep parity.
