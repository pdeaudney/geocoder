[package]
name = "regression-runner"
version = "0.1.0"
edition = "2021"
description = "Black-box regression runner for the geocoder. Reads JSON corpora, fires HTTP requests, asserts expectations."
license = "Apache-2.0"
publish = false

[dependencies]
mimalloc = { version = "0.1", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "regression-runner"
path = "src/main.rs"

[[bin]]
name = "pelias-to-ours"
path = "src/pelias_adapter.rs"

[profile.release]
opt-level = 3
lto = "thin"
