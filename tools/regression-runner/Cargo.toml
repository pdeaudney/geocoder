[package]
name = "regression-runner"
version = "0.1.0"
edition = "2021"
description = "Black-box regression runner for the geocoder. Reads JSON corpora, fires HTTP requests, asserts expectations."
license = "Apache-2.0"
publish = false

[dependencies]
mimalloc = { version = "0.1", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse the shared `haversine_m` from the server crate so on/offline
# accuracy checks share one implementation. default-features=false keeps
# tantivy/gRPC out of the regression-runner build — we only need
# query_server::geo, a leaf module.
query-server = { path = "../../server", default-features = false }

[[bin]]
name = "regression-runner"
path = "src/main.rs"

[[bin]]
name = "pelias-to-ours"
path = "src/pelias_adapter.rs"

[[bin]]
name = "bench-accuracy"
path = "src/bench_accuracy.rs"

# Profiles live at the workspace root (`/Cargo.toml`). Member-level
# profile sections are silently ignored.
