[workspace]
members = [
    "server",
    "tools/regression-runner",
    "tools/index-dumper",
    "tools/wof-importer",
]
resolver = "2"

# Profiles live here at the workspace root. Member-level
# `[profile.*]` sections are silently ignored by Cargo with a
# warning ("profiles for the non root package will be ignored");
# until this was hoisted, the LTO setting we wanted on the
# query-server release binary had been a no-op locally for the
# duration of the crate's history. Dockerfile builds `server/`
# standalone (no workspace Cargo.toml in /src) and overrides on
# the cargo invocation directly.

[profile.release]
opt-level = 3
# Thin LTO measured against the existing Criterion benches gives the
# same runtime wins on hot paths as fat LTO (-1.8 % median across
# 67 benches) at half the build-time cost (+21 % cold build vs +74 %
# for fat). The one workload where fat is meaningfully better is
# `fst_starts_with_any`, a cold path. See
# `docs/performance/lto-config-2026-04-26.md` for the measurements.
lto = "thin"

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
